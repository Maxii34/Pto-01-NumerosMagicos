<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Juego interactivo de Números Mágicos donde el usuario debe adivinar un número secreto usando pistas. Desarrollado con Bootstrap, HTML, CSS y JavaScript."
    />
    <meta name="author" content="Maxi Ordoñez" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Números mágicos</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg ">
        <div class="container d-flex align-items-center">
          <!-- Título siempre a la izquierda -->
          <a class="navbar-brand text-light" href="#">Números Mágicos</a>

          <!-- Botón hamburguesa -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Contenido colapsable -->
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto flex-row align-items-center gap-3">
              <!-- Checkbox de tema dentro del menú colapsable -->
              <li class="nav-item d-flex align-items-center">
                <input class="theme-checkbox" type="checkbox" />
              </li>
              <li>
                <a
                  href="https://github.com/Maxii34/Pto-01-NumerosMagicos"
                  target="_blank"
                  class="btn btn-dark"
                >
                  <i class="bi bi-github"></i> GitHub
                </a>
              </li>
              <li>
                <a href="" class="btn btn-dark">
                  <i class="bi bi-arrow-bar-left"></i> Volver
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="container">
      <section>
        <div id="mensajeResultado" class="mt-3 text-center">
          <p id="textoResultado"></p>
        </div>
      </section>

      <section class="py-5">
        <div class="container text-center bg-css">
          <div class="mb-3">
            <h5 class="display-6">¡Adiviná el Número Mágico!</h5>
            <p>Haz clic en "Comenzar Juego</p>
            <strong id="cambiarTexto" class="text-muted"></strong>
          </div>
          <button
            id="btnComenzar"
            class="btn btn-primary mb-4"
            onclick="cambiarTexto()"
          >
            Comenzar Juego
          </button>

          <div class="row justify-content-center">
            <div class="col-md-4 col-sm-8">
              <input
                type="number"
                id="inputNumero"
                class="form-control mb-3"
                placeholder="Ingresá un número"
                min="1"
                max="100"
              />

              <button id="btnEnviar" class="btn btn-success w-100">
                Enviar
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="text-center">
        <h5>&copy; Todos los Derechos Reservados 2025</h5>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script src="/js/app.js"></script>
  </body>
</html>
